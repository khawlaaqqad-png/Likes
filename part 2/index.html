<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Network</h1>
    </div>
    <h2>Your Feed</h2>
    <div class="container">
        <div class="profile">
            <img src="./New folder/202-2024580_png-file-profile-icon-vector-png.png" alt="icon">
            <a href="#"> Add an avatar</a>
            <p>James Doe</p>
        </div>
        <div>
            <div class="post">
                <h3>Neil M</h3>
                <p><span class="likeCount1">0</span> like(s)</p>
                <button onclick="Like(this ,'.likeCount1' )">Like</button>
                <p>I just set up this new discord bot, let me know what you all thik.<a href="#">link</a></p>
            </div>
            <div class="post">
                <h3>Nichole K</h3>
                <p><span class="likeCount2">0</span> like(s)</p>
                <button onclick="Like(this ,'.likeCount2')">Like</button>
                <p>Just finshed my <a href="#">next comic</a>, check it out.</p>
            </div>
            <div class="post">
                <h3>Jim R</h3>
                <p><span class="likeCount3">0</span> like(s)</p>
                <button onclick="Like(this ,'.likeCount3')">Like</button>
                <p>I can't stop listening to the <a href="#">new album</a>. who else is liking it?</p>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
